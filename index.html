<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cappy la Carpincho</title>
<meta name="theme-color" content="#12041a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Cappy la Carpincho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0d0510;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .btn{position:fixed;border-radius:50%;background:rgba(30,8,20,.45);border:2px solid rgba(220,40,70,.55);color:rgba(255,220,225,.85);
       display:flex;align-items:center;justify-content:center;font:bold 26px sans-serif;pointer-events:none;transition:background .05s}
  .btn.on{background:rgba(200,20,60,.55)}
  #stick{position:fixed;left:calc(max(20px,env(safe-area-inset-left)) + 4px);bottom:14px;width:124px;height:124px;border-radius:50%;
    background:radial-gradient(circle,rgba(60,10,35,.35),rgba(30,8,20,.5));border:2px solid rgba(220,40,70,.55);pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(200,30,70,.55);border:2px solid rgba(255,200,215,.7);box-shadow:0 0 10px rgba(255,40,90,.4)}
  #stick.on{border-color:rgba(255,120,150,.9)}
  #bJ{right:max(22px,env(safe-area-inset-right));bottom:24px;width:86px;height:86px;font-size:30px}
  #bP{right:calc(max(14px,env(safe-area-inset-right)) + 50px);top:10px;width:40px;height:40px;font-size:14px;pointer-events:auto}
  body.menu #bP{display:none}
  #bM{right:max(14px,env(safe-area-inset-right));top:10px;width:40px;height:40px;font-size:18px;pointer-events:auto}
  #bM.off{opacity:.4;text-decoration:line-through}
  body.menu .btn:not(#bM),body.menu #stick{display:none}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#120612;color:#f3c;font:bold 20px Georgia,serif;text-align:center;padding:20px;z-index:9}
  #rot span{font-size:48px;margin-bottom:12px}
  @media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bJ">⤒</div>
<div class="btn" id="bM">♪</div>
<div class="btn" id="bP">❚❚</div>
<div id="rot"><span>📱↻</span>Girá el celular para jugar</div>

  const r=rects||getRects(), t={L:0,R:0,D:0,J:0};
  const st=document.getElementById('stick'), sr=st.getBoundingClientRect(), cx=sr.left+sr.width/2, cy=sr.top+sr.height/2, RAD=sr.width/2;
  if(stickId!==null&&!ptrs.has(stickId)){stickId=null;stickO=null;}
  if(stickId===null){st.style.left='';st.style.top='';st.style.bottom='';
    for(const [id,p] of ptrs)if(p.x<innerWidth*0.45&&p.y>innerHeight*0.3){stickId=id;
      const hw=sr.width/2,ox2=Math.max(hw+4,Math.min(innerWidth*0.45,p.x)),oy2=Math.max(hw+4,Math.min(innerHeight-hw-4,p.y));
      st.style.left=(ox2-hw)+'px';st.style.top=(oy2-hw)+'px';st.style.bottom='auto';stickO={x:ox2,y:oy2};break;}}
  let kx=0,ky=0;const SC=stickO||{x:cx,y:cy};
  if(stickId!==null){const p=ptrs.get(stickId);let dx=p.x-SC.x,dy=p.y-SC.y;const m=Math.hypot(dx,dy);if(m>RAD){dx*=RAD/m;dy*=RAD/m;}kx=dx;ky=dy;
    const mg=Math.hypot(dx,dy);if(mg>RAD*.18){if(dx<-RAD*.28)t.L=1; if(dx>RAD*.28)t.R=1; if(dy>RAD*.5)t.D=1;}}
  document.getElementById('knob').style.transform='translate('+kx+'px,'+ky+'px)';st.classList.toggle('on',stickId!==null);
  for(const [id,p] of ptrs){
    if(id===stickId)continue;
    for(const k in r){const b=r[k],m=14; if(p.x>b.left-m&&p.x<b.right+m&&p.y>b.top-m&&p.y<b.bottom+m)t[k]=1;}
    if(p.x>innerWidth*0.55)t.J=1;
  }
  inp.L=t.L||keys.ArrowLeft||keys.KeyA?1:0;
  inp.R=t.R||keys.ArrowRight||keys.KeyD?1:0;
  inp.D=t.D||keys.ArrowDown||keys.KeyS?1:0;
  inp.J=t.J||keys.Space||keys.KeyZ||keys.KeyK||keys.ArrowUp||keys.KeyW?1:0;
  inp.Jp=inp.J&&!prevJ.v; prevJ.v=inp.J;
  for(const k in BTN)document.getElementById(BTN[k]).classList.toggle('on',!!t[k]);
}

function anyTap(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  const fs=()=>{try{document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}catch(e){}};
  if(state==='vn'){vnAdvance();prevJ.v=1;return;}
  if(state==='talk'){advanceTalk();prevJ.v=1;return;}
  if(state==='select'){if(inBtn(backBtn)){state='title';return;}
    for(let i=0;i<LEVELS.length;i++)if(inBtn(cardRect(i))){LV=i;lives=3;termos=3;single=1;points=0;lifePts=50000;startLevel();prevJ.v=1;fs();return;}return;}
  if(state==='shop'){shopTap();return;}
  if(state==='pause'){const B=pauseBtns();if(inBtn(B.shop)&&!arena&&!cur.secret){if(ac)ac.resume();openShop();return;}if(inBtn(B.go)){unPause();}else if(inBtn(B.re)){if(ac)ac.resume();points=lvlStart;score=lvlScore0;startLevel();prevJ.v=1;}else if(inBtn(B.out)){if(ac)ac.resume();state='title';musCur=null;}return;}
  if(state==='title'){const TL=titleList();
    if(TL.length===1||!tapPos){newGame();prevJ.v=1;fs();return;}
    for(const b of TL)if(inBtn(b)){
      if(b.id==='new'){newGame();}
      else if(b.id==='cont'){const c=SAVE.cont;LV=c.LV;lives=c.lives;termos=c.termos||3;score=c.score||0;points=c.points;lifePts=c.lifePts||50000;single=0;startLevel();}
      else if(b.id==='sel'){state='select';}
      else if(b.id==='sec'){LV=LEVELS.length-1;lives=3;termos=3;points=0;lifePts=50000;single=2;startLevel();}
      prevJ.v=1;fs();return;}
    return;}
  if(state==='cont'){const B=contBtns();
    if(inBtn(B.yes)||(!tapPos&&keys.Space)){lives=3;termos=3;score=lvlScore0;points=lvlStart;P.shield=0;P.speedT=0;startLevel();prevJ.v=1;return;}
    if(inBtn(B.no)){state='over';return;}
    contT=Math.max(1,contT-30);return;}

}
